# Matchday — Supabase local development configuration.
# Requires the Supabase CLI and Docker. See README.md → "Local database".

project_id = "matchday"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Local mail catcher. Magic links and one-time codes sent during local
# development are viewable at http://127.0.0.1:54324 — they are never delivered
# to a real inbox.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
# Matchday authenticates with email magic links / one-time codes only.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
otp_length = 6
otp_expiry = 3600

# ── Local email templates ──────────────────────────────────────────────────
#
# These mirror the templates production will carry once the confirmation flow
# is switched over, so the end-to-end suite exercises the real link shape —
# `/auth/continue?token_hash=…&type=…` on our own origin — rather than a URL a
# test composed for itself. Production templates are edited by hand in the
# Supabase dashboard; this is the rehearsal.
[auth.email.template.confirmation]
subject = "Confirm your email address"
content_path = "./supabase/templates/confirm-signup.html"

[auth.email.template.magic_link]
subject = "Your sign-in link"
content_path = "./supabase/templates/magic-link.html"

[auth.sms]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[analytics]
enabled = false
