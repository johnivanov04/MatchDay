# Matchday — Supabase local development configuration.
# Requires the Supabase CLI and Docker. See README.md → "Local database".

project_id = "matchday"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Local mail catcher. Magic links and one-time codes sent during local
# development are viewable at http://127.0.0.1:54324 — they are never delivered
# to a real inbox.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
# Ten, matching `passwordSchema` in src/lib/validation/password.ts. Supabase is
# the authority — the client-side rule exists so somebody is told before they
# submit rather than after. No composition requirements: length is what makes a
# password hard to guess, and forcing a symbol mostly produces "Password1!".
minimum_password_length = 10

[auth.email]
# MatchDay authenticates with email + password, keeping the one-time code as a
# secondary option. `enable_confirmations` is what makes a password signup send
# a verification email and withhold the session until it is confirmed — the
# behaviour Stage 3 is built around, and the one setting production must match.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# Left OFF deliberately. Turning it on requires the *current* password for any
# change, which historical passwordless accounts do not have — it would lock
# every pre-password member out of setting their first one. See the Stage 3
# report for the tradeoff and the safe alternative.
secure_password_change = false
otp_length = 6
otp_expiry = 3600

# ── Local email templates ──────────────────────────────────────────────────
#
# These mirror the templates production will carry once the confirmation flow
# is switched over, so the end-to-end suite exercises the real link shape —
# `/auth/continue?token_hash=…&type=…` on our own origin — rather than a URL a
# test composed for itself. Production templates are edited by hand in the
# Supabase dashboard; this is the rehearsal.
[auth.email.template.confirmation]
subject = "Confirm your email address"
content_path = "./supabase/templates/confirm-signup.html"

[auth.email.template.magic_link]
subject = "Your sign-in link"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

[auth.sms]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[analytics]
enabled = false
