name: Deploy production

# ── WHY THIS WORKFLOW EXISTS ─────────────────────────────────────────────────
#
# Build #2 shipped application code to production while two Supabase migrations
# were still pending. Vercel deployed on merge; the schema was applied by hand
# some time later; and in between, every player who tapped "Enable phone
# notifications" was told they lacked permission — because the function the code
# called did not exist yet.
#
# Two independent pipelines with no ordering between them will do that again.
# This workflow makes the ordering explicit: migrations first, deploy second,
# and no deploy at all if the migrations do not apply cleanly.
#
# Vercel's own production deploys are switched off in `vercel.json`
# (`git.deploymentEnabled.main: false`) so there is exactly one path to
# production. Preview deployments for every other branch are untouched.

on:
  push:
    branches: [main]
  # Re-running a deploy by hand is genuinely useful — a failed health check, an
  # expired token. The job-level `if` below pins it to `main`, so choosing any
  # other ref in the UI runs nothing rather than deploying a feature branch.
  workflow_dispatch:

# Never two production deploys at once, and never cancel one midway: a cancelled
# run could stop between `db push` and the deploy, which is the exact state this
# workflow exists to prevent.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The same lint, type-check, test, build and end-to-end suite a pull request
  # runs — reused rather than restated, so the two cannot drift.
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Migrate, then deploy
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Every production credential is scoped to this environment. A pull-request
    # workflow does not declare it and therefore cannot read any of them, which
    # is what keeps untrusted PR code away from the production database.
    environment: production

    steps:
      - name: Check out the exact commit that triggered this run
        uses: actions/checkout@v4
        with:
          # Not a branch name: `main` could have moved while `verify` ran, and
          # deploying a commit that was never verified is the failure mode this
          # workflow is meant to remove.
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # Pinned, not `latest`. A deployment pipeline that silently changes its
      # own tooling between runs cannot be reasoned about, and both of these
      # versions are the ones this cutover was rehearsed against.
      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Install the Vercel CLI
        run: npm install --global vercel@54.6.1

      # ── Database first ───────────────────────────────────────────────────
      #
      # Straight to Postgres over `--db-url`, with no `supabase link` and no
      # management API in the path at all.
      #
      # `link` was tried first and refused twice: "Authorization failed for the
      # access token and project ref pair". A project-scoped token with Project
      # Settings READ and Migrations READ-WRITE authenticates fine but is not
      # authorised for the endpoint `link` calls — and chasing the right scope
      # would leave the pipeline depending on a permission model that can change
      # underneath it.
      #
      # Migrations are DDL against one database. A connection string is all they
      # ever needed, and it collapses three secrets into one.
      #
      # The URL is a Session Pooler connection string, supplied whole and used
      # verbatim — never reconstructed here, because the pooler host, port and
      # username differ from the direct endpoint and guessing any of them turns
      # a working deploy into a failed one. It is passed by environment variable
      # and never interpolated into a logged command line.
      - name: Show what would be applied
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      # Belt and braces. `db push` exits non-zero on failure, but "the push
      # reported success" and "production now has every migration this commit
      # carries" are different claims, and only the second one licenses a deploy.
      - name: Verify migration parity
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase migration list --db-url "$SUPABASE_DB_URL" \
            --output-format json > migrations.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const raw = readFileSync('migrations.json', 'utf8');
          const line = raw.split('\n').find((l) => l.trim().startsWith('{'));
          if (!line) {
            console.error('Could not read the migration list.');
            process.exit(1);
          }
          const { migrations } = JSON.parse(line);
          const pending = migrations.filter((m) => m.local && !m.remote);
          const unknown = migrations.filter((m) => m.remote && !m.local);
          console.log(`local ${migrations.filter((m) => m.local).length}, pending ${pending.length}, remote-only ${unknown.length}`);
          for (const m of pending) console.error(`PENDING: ${m.local}`);
          // A migration the remote has and this commit does not means production
          // is ahead of the code — a rollback, or somebody applying by hand.
          // Worth failing on: deploying older code over a newer schema is the
          // mirror image of the incident this workflow prevents.
          for (const m of unknown) console.error(`REMOTE-ONLY: ${m.remote}`);
          if (pending.length > 0 || unknown.length > 0) process.exit(1);
          console.log('Migration parity confirmed.');
          NODE

      # ── Only now, the application ────────────────────────────────────────
      #
      # Reached only if every step above succeeded, which is the whole point:
      # new code cannot become active before the schema it depends on exists.
      # ── The application, staged before it is promoted ────────────────────
      #
      # Reached only if every step above succeeded, which is the whole point:
      # new code cannot become active before the schema it depends on exists.
      #
      # ── WHY NOT `vercel build` + `--prebuilt` ────────────────────────────
      #
      # That is what this workflow did first, and it took production down. The
      # runner built with Node 22 while the Vercel project runs Node 24, so the
      # prebuilt output was assembled for a runtime it would never execute on.
      # Every gate passed — the build succeeded, the deploy succeeded, the
      # deployment reported READY — and every dynamic route answered 500.
      #
      # Building on Vercel removes the class of fault entirely. The project's
      # own runtime and environment are used by definition, and there is no
      # second place for them to be configured and drift.
      #
      # `vercel pull` is gone with it. It was only needed to feed a local build,
      # and it writes `.vercel/.env.production.local` — every production secret,
      # including the APNs signing key, onto the runner's disk for no reason.
      - name: Create a staged production deployment
        id: stage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # `--skip-domain` builds and deploys to production *without* aliasing
          # the production domains to it. The result is a real production
          # deployment, reachable at its own URL, that nobody is being served.
          vercel deploy --prod --skip-domain --yes --token="$VERCEL_TOKEN" > staged-url.txt
          url="$(cat staged-url.txt)"
          case "$url" in
            https://*) ;;
            *) echo "Did not get a deployment URL back."; exit 1 ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Staged: $url"

      # ── The gate that was missing ────────────────────────────────────────
      #
      # The previous version health-checked *after* the alias moved, so it could
      # only report damage that was already live. Checking the staged URL first
      # means a broken build is never served: the production domains stay on the
      # deployment they are on, and this job fails instead.
      #
      # `vercel curl` targets a specific deployment and carries the protection
      # bypass, so a deployment that is not publicly reachable can still be
      # inspected. A plain curl to the staged URL would be answered by Vercel's
      # authentication page rather than by the application.
      - name: Health-check the staged deployment before promoting it
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          STAGED_URL: ${{ steps.stage.outputs.url }}
        run: |
          # `vercel curl` invokes the system curl and forwards these flags to it.
          #
          # `--fail-with-body` is doing the real work. Plain curl exits 0 for an
          # HTTP 500 — it fetched a page, and it does not care what the status
          # was — so a probe without it reports success against a completely
          # broken deployment. Measured against a live deployment: a 404 exits 0
          # without the flag and 22 with it. The body is still printed, which is
          # what makes a failure diagnosable.
          #
          # ── AND THAT FORWARDING IS WHY THERE IS NO `--token` HERE ──────────
          #
          # The same pass-through that carries `--fail-with-body` to curl also
          # carried `--token`, which curl does not have:
          #
          #     curl: option --token=***: is unknown
          #
          # Every probe died before making a request. Authentication comes from
          # `VERCEL_TOKEN` in this step's environment instead, which the CLI
          # reads natively. `vercel deploy` and `vercel promote` keep their
          # `--token` flags — those commands consume it rather than forwarding
          # it, and both have already succeeded in CI.
          probe() {
            vercel curl "$1" --deployment "$STAGED_URL" --yes \
              --silent --show-error --fail-with-body
          }

          # /api/health is the one endpoint where a 2xx is not enough. It answers
          # 200 with a body describing what it checked, and a deployment that
          # boots but cannot reach the database would pass on status alone.
          healthy=""
          for attempt in 1 2 3 4 5; do
            if body="$(probe /api/health)"; then
              case "$body" in
                *'"status":"ok"'*)
                  case "$body" in
                    *'"database":"ok"'*) healthy=yes ;;
                  esac
                  ;;
              esac
            else
              body="request failed"
            fi
            echo "health attempt $attempt: $(printf '%s' "$body" | head -c 200)"
            [ -n "$healthy" ] && break
            # A cold function is slower on its first request; that is not a fault.
            sleep 10
          done

          if [ -z "$healthy" ]; then
            echo 'Staged deployment is not healthy. Production is untouched.'
            exit 1
          fi

          # The rest are status-only, and `--fail-with-body` is the assertion:
          # any 4xx or 5xx exits non-zero and takes the step down with it. These
          # three are here because the outage this replaced took out every
          # dynamic route, not just the health endpoint — a server-rendered
          # page, a static page, and the association document Apple fetches.
          for path in /sign-in /privacy /.well-known/apple-app-site-association; do
            if ! probe "$path" > /dev/null; then
              echo "Staged deployment failed on $path. Production is untouched."
              exit 1
            fi
            echo "ok: $path"
          done

          echo 'Staged deployment is healthy.'

      - name: Promote the staged deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          STAGED_URL: ${{ steps.stage.outputs.url }}
        run: |
          vercel promote "$STAGED_URL" --yes --token="$VERCEL_TOKEN"
          echo "Promoted: $STAGED_URL"

      - name: Verify production is healthy
        run: |
          for attempt in 1 2 3 4 5; do
            body=$(curl --silent --show-error --max-time 15 https://app.matchdayapps.com/api/health || true)
            echo "attempt $attempt: $body"
            case "$body" in
              *'"status":"ok"'*) echo 'Production is healthy.'; exit 0 ;;
            esac
            sleep 10
          done
          echo 'Production did not report healthy after promotion.'
          exit 1
