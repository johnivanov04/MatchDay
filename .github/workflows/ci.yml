name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# A newer push to the same ref makes the running job obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Placeholders only. `next build` needs these variables to exist; it never
      # contacts Supabase, and no real credential belongs in this file.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # The database suite boots its own throwaway PostgreSQL server via
      # `embedded-postgres`, so it needs neither a service container nor the
      # Supabase CLI. It applies the real migrations and the real seed file.
      #
      # This deliberately does NOT include the `storage` project. Those tests
      # need a real Supabase Storage service, which this job does not have, and
      # a suite that skipped here would report the MIME allowlist and the size
      # cap as verified when nothing had run. They belong to the `e2e` job
      # below, which has a stack — see `vitest.config.mts`.
      - name: Test (unit, integration, RLS, tenancy and components)
        run: npm test

      # Deliberately a separate, named step even though `npm test` already
      # includes these files. Capacity and promotion correctness under genuine
      # parallel connections is the hardest guarantee in the product, and a
      # dedicated gate makes it obvious in the job summary when it is the thing
      # that broke — rather than one line inside a 1000-test run.
      #
      # The pattern matches every `*concurrency*.test.ts` under tests/db, so a
      # suite added later is picked up without editing this file. Vitest exits
      # non-zero when a filter matches nothing, so the command cannot quietly
      # degrade into testing less than it claims.
      - name: Concurrency tests
        run: npm run test:concurrency

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # Slower than `verify` because it boots the whole Supabase stack in Docker
    # and builds the application before a single test runs.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The GitHub runner ships Docker, which is all `supabase start` needs.
      # This brings up PostgreSQL, GoTrue and PostgREST — the real stack the
      # E2E suite authenticates against, rather than a mock of it.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Apply migrations and seed
        run: supabase db reset --no-seed=false

      # Captured once and passed on, so the specs never shell out to the CLI
      # from inside a worker and no key is ever written to a file.
      - name: Export Supabase credentials
        run: |
          {
            echo "E2E_SUPABASE_URL=$(supabase status -o json | jq -r '.API_URL')"
            echo "E2E_DATABASE_URL=$(supabase status -o json | jq -r '.DB_URL')"
            echo "E2E_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')"
          } >> "$GITHUB_ENV"

      # ── The only place the Storage service is exercised ───────────────────
      #
      # `allowed_mime_types` and `file_size_limit` are columns on
      # `storage.buckets` that only the Storage service reads; no constraint,
      # policy or SQL insert can reach them. Public object retrieval is the
      # same — the public endpoint never consults Row Level Security, so no
      # database test can tell you whether a signed-out browser can fetch an
      # avatar. These run here because this is the job that already has a real
      # stack; adding one to `verify` would double a five-minute Docker boot to
      # test five things.
      #
      # THEY CANNOT SKIP. The suite treats `CI` being set as "a missing stack
      # is a hard failure", rather than reading an opt-in flag from this file —
      # because forgetting to pass such a flag is exactly the failure this is
      # guarding against, and a green job that verified nothing is worse than
      # no job. See tests/storage/helpers/stack.ts.
      #
      # Before the browsers install, so a storage regression reports in seconds
      # rather than after a Chromium download and a production build.
      - name: Storage API tests (real Supabase Storage)
        run: npm run test:storage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        env:
          # The application reads the public pair; the suite reads the E2E_*
          # pair above. Both point at the stack this job just started.
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.E2E_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
        run: npm run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
