name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# A newer push to the same ref makes the running job obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Placeholders only. `next build` needs these variables to exist; it never
      # contacts Supabase, and no real credential belongs in this file.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # The database suite boots its own throwaway PostgreSQL server via
      # `embedded-postgres`, so it needs neither a service container nor the
      # Supabase CLI. It applies the real migrations and the real seed file.
      #
      # This deliberately does NOT include the `storage` project. Those tests
      # need a real Supabase Storage service, which this job does not have, and
      # a suite that skipped here would report the MIME allowlist and the size
      # cap as verified when nothing had run. They belong to the `e2e` job
      # below, which has a stack — see `vitest.config.mts`.
      - name: Test (unit, integration, RLS, tenancy and components)
        run: npm test

      # Deliberately a separate, named step even though `npm test` already
      # includes these files. Capacity and promotion correctness under genuine
      # parallel connections is the hardest guarantee in the product, and a
      # dedicated gate makes it obvious in the job summary when it is the thing
      # that broke — rather than one line inside a 1000-test run.
      #
      # The pattern matches every `*concurrency*.test.ts` under tests/db, so a
      # suite added later is picked up without editing this file. Vitest exits
      # non-zero when a filter matches nothing, so the command cannot quietly
      # degrade into testing less than it claims.
      - name: Concurrency tests
        run: npm run test:concurrency

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # Slower than `verify` because it boots the whole Supabase stack in Docker
    # and builds the application before a single test runs.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The GitHub runner ships Docker, which is all `supabase start` needs.
      # This brings up PostgreSQL, GoTrue and PostgREST — the real stack the
      # E2E suite authenticates against, rather than a mock of it.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Apply migrations and seed
        run: supabase db reset --no-seed=false

      # Captured once and passed on, so the specs never shell out to the CLI
      # from inside a worker and no key is ever written to a file.
      - name: Export Supabase credentials
        run: |
          {
            echo "E2E_SUPABASE_URL=$(supabase status -o json | jq -r '.API_URL')"
            echo "E2E_DATABASE_URL=$(supabase status -o json | jq -r '.DB_URL')"
            echo "E2E_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')"
            # The mail catcher. The email-confirmation spec reads the real
            # message out of it rather than composing the link it is meant to
            # be testing, so a missing value must fail the job rather than
            # quietly skip the one test that covers the cross-browser flow.
            echo "E2E_MAILPIT_URL=$(supabase status -o json | jq -r '.MAILPIT_URL // .INBUCKET_URL')"
          } >> "$GITHUB_ENV"

      # ── The only place the Storage service is exercised ───────────────────
      #
      # `allowed_mime_types` and `file_size_limit` are columns on
      # `storage.buckets` that only the Storage service reads; no constraint,
      # policy or SQL insert can reach them. Public object retrieval is the
      # same — the public endpoint never consults Row Level Security, so no
      # database test can tell you whether a signed-out browser can fetch an
      # avatar. These run here because this is the job that already has a real
      # stack; adding one to `verify` would double a five-minute Docker boot to
      # test five things.
      #
      # THEY CANNOT SKIP. The suite treats `CI` being set as "a missing stack
      # is a hard failure", rather than reading an opt-in flag from this file —
      # because forgetting to pass such a flag is exactly the failure this is
      # guarding against, and a green job that verified nothing is worse than
      # no job. See tests/storage/helpers/stack.ts.
      #
      # Before the browsers install, so a storage regression reports in seconds
      # rather than after a Chromium download and a production build.
      - name: Storage API tests (real Supabase Storage)
        run: npm run test:storage

      # ── Chromium, without betting the job on an Ubuntu mirror ─────────────
      #
      # This was `npx playwright install --with-deps chromium`, and it stalled
      # for twenty minutes on two consecutive runs. `--with-deps` runs
      # `apt-get update` first, and the runner's configured mirror —
      # `azure.archive.ubuntu.com` — was answering with `Ign:` lines and
      # crawling through a fallback. The tests never started. Nothing was wrong
      # with MatchDay, Playwright, or the tests: an external package mirror had
      # a bad day and consumed the entire job.
      #
      # The fix is to stop asking apt anything on the ordinary path, and to
      # *prove* that is safe rather than assume it — see the verification step
      # below, which runs on every build.
      #
      # `playwright_version` is read from the lockfile so the cache key follows
      # the pinned browser build. Playwright downloads a browser revision tied
      # to its own version, so two runs on one version want the identical
      # binary, and a version bump misses the cache and fetches a fresh one.
      - name: Resolve the pinned Playwright version
        id: playwright
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright $version"

      - name: Cache the Chromium build
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # No `--with-deps`: this fetches the browser from Playwright's own CDN and
      # touches apt not at all. Bounded, because a download is the one thing
      # here that can still hang on somebody else's infrastructure — and five
      # minutes is generous for ~170MB that is usually already cached.
      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install chromium

      # ── Proving the system libraries are there ───────────────────────────
      #
      # Dropping `--with-deps` is only honest if something checks. The runner
      # image ships Google Chrome, Chromium and Microsoft Edge, whose Debian
      # packages depend on exactly the set Playwright lists for chromium
      # (libnss3, libgbm1, libatk*, libasound2t64, libdrm2, libxkbcommon0 …), so
      # in practice they are all present — but "in practice" is not a thing to
      # build a pipeline on, and GitHub rolls new images regularly.
      #
      # So this asks the linker instead of trusting a manifest. `ldd` over the
      # browser binary and the shared objects beside it is the same signal
      # Playwright's own `validateDependenciesLinux` uses, and it needs no
      # network at all. `install-deps --dry-run` would have been the obvious
      # probe and is deliberately not used: on Linux it simulates the install
      # *through apt-get*, which is the very thing that hangs.
      #
      # If anything is genuinely missing, apt runs — but only then, only for
      # what is missing, with retries and a real timeout so a sick mirror fails
      # in minutes instead of idling until the job is killed.
      - name: Verify Chromium's system dependencies
        timeout-minutes: 6
        run: |
          set -euo pipefail

          binary="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          echo "Chromium: $binary"

          # `|| true` on every ldd: a binary that cannot be read is not a reason
          # to fail the check, and under `set -o pipefail` an unguarded failure
          # inside the group would take the whole pipeline down.
          missing_libraries() {
            {
              ldd "$binary" || true
              find "$(dirname "$binary")" \( -name '*.so' -o -name '*.so.*' \) -print 2>/dev/null \
                | while read -r object; do ldd "$object" 2>/dev/null || true; done
            } | awk '/not found/ { print $1 }' | sort -u
          }

          missing="$(missing_libraries)"
          if [ -z "$missing" ]; then
            echo "Every shared library Chromium links against resolves. apt not needed."
            exit 0
          fi

          echo "::warning::Chromium is missing shared libraries; installing system dependencies."
          printf '%s\n' "$missing"

          # Ubuntu 24.04 keeps its sources in deb822 format; older layouts kept
          # the one-line file. Rewrite whichever exists, so the known-flaky
          # Azure mirror is not the one apt is waiting on.
          # `if` rather than `[ -f … ] && …`: under `set -e` a false test as the
          # last command of the loop body would exit the step, and this branch
          # only runs when something is already wrong.
          for sources in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
            if [ -f "$sources" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$sources"
            fi
          done

          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=25 update
          npx playwright install-deps chromium

          missing="$(missing_libraries)"
          if [ -n "$missing" ]; then
            echo "::error::Chromium still cannot resolve its libraries after installing dependencies."
            printf '%s\n' "$missing"
            exit 1
          fi
          echo "System dependencies installed; Chromium now resolves cleanly."

      - name: Run end-to-end tests
        env:
          # The application reads the public pair; the suite reads the E2E_*
          # pair above. Both point at the stack this job just started.
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.E2E_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
          # ── AND THE SERVER-SIDE KEY, WHICH THIS JOB USED NOT TO NEED ───────
          #
          # Playwright's `webServer` inherits this step's environment, so this
          # is the Next.js server's configuration. Until account deletion the
          # application never needed the service role at runtime: push dispatch
          # is the only other consumer and it degrades to in-app-only without
          # complaint, so its absence here was invisible.
          #
          # Deleting an `auth.users` row can only be done through the Auth Admin
          # API, which is service-role-only. Without this the server logged
          # `account_deletion.admin_client_unavailable` on every deletion, never
          # contacted GoTrue, and left the Auth identity — and therefore the
          # real email address — in place. Locally `.env.local` supplies it and
          # `next start` picks it up, which is why the suite passed there and
          # failed here.
          #
          # Same value the E2E fixtures already hold, from the stack this job
          # started. Nothing new is exposed: it never reaches a browser, and
          # `src/lib/supabase/admin.ts` refuses to construct a client outside the
          # server.
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.E2E_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
