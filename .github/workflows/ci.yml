name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# A newer push to the same ref makes the running job obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Placeholders only. `next build` needs these variables to exist; it never
      # contacts Supabase, and no real credential belongs in this file.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # The database suite boots its own throwaway PostgreSQL server via
      # `embedded-postgres`, so it needs neither a service container nor the
      # Supabase CLI. It applies the real migrations and the real seed file.
      - name: Test (unit, integration, RLS and tenancy)
        run: npm test

      - name: Production build
        run: npm run build
